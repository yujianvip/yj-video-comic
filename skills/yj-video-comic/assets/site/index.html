<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="360°视频互动漫画">
<title>互动漫画</title>
<style>
:root{--accent:#e4472e;--bg:#171513;--paper:#fffdf5;--ink:#171513}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:"Microsoft YaHei","PingFang SC",sans-serif}
canvas.webgl{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}.dragging{cursor:grabbing!important}
#title{position:fixed;top:16px;left:20px;color:var(--paper);z-index:3;text-shadow:0 2px 12px #000;font-size:clamp(18px,2.2vw,32px);letter-spacing:.08em;pointer-events:none}
#captions{position:fixed;inset:0;z-index:2;pointer-events:none}.caption{position:absolute;padding:8px 11px;background:var(--paper);color:var(--ink);border:2px solid var(--ink);box-shadow:3px 4px 0 rgba(0,0,0,.4);font-weight:700;line-height:1.45;transform:translate(-50%,-50%);overflow-wrap:anywhere}.caption b{color:var(--accent);margin-right:.45em}
#help{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:4;color:#fff;background:#000a;border:1px solid #ffffff33;border-radius:99px;padding:7px 15px;font-size:13px;pointer-events:none;transition:opacity .5s}
#toolbar{position:fixed;z-index:5;bottom:max(14px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:6px;background:var(--paper);border-radius:20px;box-shadow:0 10px 34px #0009;white-space:nowrap}
button{border:0;border-radius:14px;padding:8px 13px;background:transparent;color:var(--ink);font:600 13px inherit;cursor:pointer}button:hover,button[aria-pressed=true]{background:var(--ink);color:var(--paper)}button:focus-visible{outline:3px solid var(--accent)}.focus-only{display:none}body.focus .focus-only{display:block}
#status{padding:0 9px;color:#706960;font-size:12px}
@media(max-width:640px){#title{top:10px;left:12px}.caption{max-width:42vw;padding:6px 8px;font-size:12px}#help{top:auto;bottom:72px;font-size:11px}button{padding:7px 9px}#status{display:none}}
</style>
</head>
<body>
<h1 id="title"></h1><div id="captions" aria-hidden="true"></div><div id="help">横向拖动漫画格旋转视角 · 点击进入单格</div>
<div id="toolbar" role="toolbar" aria-label="漫画控制">
  <button class="focus-only" id="prev">‹ 上一格</button><button class="focus-only" id="back">返回整页</button><button class="focus-only" id="next">下一格 ›</button>
  <button id="spin" aria-pressed="false">全部转动</button><button id="reset">复位</button><button id="ink" aria-pressed="true">网点</button><span id="status"></span>
</div>
<div id="videos" hidden></div>
<script>window.COMIC_DATA=__COMIC_DATA__;</script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const D=window.COMIC_DATA,P=D.panels;
document.documentElement.lang=D.language;document.title=D.title;document.querySelector('meta[name=description]').content=D.theme;
document.documentElement.style.setProperty('--accent',D.style.accent);document.documentElement.style.setProperty('--bg',D.style.background);
const $=id=>document.getElementById(id);$('title').textContent=D.title;$('ink').setAttribute('aria-pressed',String(D.style.halftone));

const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.domElement.className='webgl';renderer.domElement.tabIndex=0;renderer.domElement.setAttribute('aria-label',`${D.title}，${P.length}格360度互动漫画`);document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(D.style.background);const camera=new THREE.OrthographicCamera(-1,1,1,-1,.1,100);camera.position.z=10;
const group=new THREE.Group();scene.add(group);const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();
const vertex=`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`;
const fragment=`uniform sampler2D map;uniform float ink;uniform vec2 resolution;varying vec2 vUv;void main(){vec4 c=texture2D(map,vUv);float lum=dot(c.rgb,vec3(.299,.587,.114));vec2 p=gl_FragCoord.xy;float dots=step(.46+.28*lum,length(fract(p/5.)-.5));vec3 comic=mix(c.rgb*.72,c.rgb,dots);gl_FragColor=vec4(mix(c.rgb,comic,ink),1.);}`;
const states=[];let ink=D.style.halftone,focus=-1,drag=null,hover=-1;

P.forEach((p,i)=>{
  const v=document.createElement('video');v.src=p.src;v.muted=true;v.playsInline=true;v.preload='auto';$('videos').append(v);
  const tex=new THREE.VideoTexture(v);tex.colorSpace=THREE.SRGBColorSpace;tex.minFilter=THREE.LinearFilter;tex.magFilter=THREE.LinearFilter;
  const mat=new THREE.ShaderMaterial({uniforms:{map:{value:tex},ink:{value:ink?1:0},resolution:{value:new THREE.Vector2()}},vertexShader:vertex,fragmentShader:fragment});
  const mesh=new THREE.Mesh(polygonGeometry(shapePoints(p.shape)),mat);mesh.userData.index=i;group.add(mesh);
  const border=new THREE.LineLoop(new THREE.BufferGeometry(),new THREE.LineBasicMaterial({color:0x070707}));mesh.add(border);
  const state={v,tex,mat,mesh,border,angle:p.startAngle||0,start:p.startAngle||0,spin:false,seeking:false,want:0};states.push(state);
  v.addEventListener('loadedmetadata',()=>seek(state));v.addEventListener('seeked',()=>{state.seeking=false;state.tex.needsUpdate=true;if(Math.abs(state.want-v.currentTime)>.025)seek(state)});
  const cap=document.createElement('div');cap.className='caption';cap.innerHTML=`<b>${String(i+1).padStart(2,'0')}</b>${escapeHtml(p.caption)}`;$('captions').append(cap);state.cap=cap;
});

function escapeHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function shapePoints(shape){if(Array.isArray(shape))return shape;return({rectangle:[[0,0],[1,0],[1,1],[0,1]],'trapezoid-left':[[.17,0],[1,0],[1,1],[0,1]],'trapezoid-right':[[0,0],[.83,0],[1,1],[0,1]],'slant-left':[[.14,0],[1,0],[.86,1],[0,1]],'slant-right':[[0,0],[.86,0],[1,1],[.14,1]],hexagon:[[.13,0],[.87,0],[1,.5],[.87,1],[.13,1],[0,.5]],irregular:[[.08,0],[.92,.03],[1,.83],[.81,1],[.06,.92],[0,.23]]})[shape]||[[0,0],[1,0],[1,1],[0,1]]}
function polygonGeometry(points,videoRatio=1,frameRatio=1){const positions=[],uvs=[],indices=[];const cropX=Math.min(1,frameRatio/videoRatio),cropY=Math.min(1,videoRatio/frameRatio);for(const [x,y] of points){positions.push(x-.5,.5-y,0);uvs.push(.5+(x-.5)*cropX,.5+(.5-y)*cropY)}for(let i=1;i<points.length-1;i++)indices.push(0,i+1,i);const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));geo.setAttribute('uv',new THREE.Float32BufferAttribute(uvs,2));geo.setIndex(indices);geo.computeVertexNormals();return geo}
function setPolygon(s,points,frameRatio,videoRatio){s.mesh.geometry.dispose();s.mesh.geometry=polygonGeometry(points,videoRatio,frameRatio);s.border.geometry.dispose();s.border.geometry=new THREE.BufferGeometry().setFromPoints(points.map(([x,y])=>new THREE.Vector3(x-.5,.5-y,.012)))}
function seek(s){if(!s.v.duration||s.seeking)return;const p=P[s.mesh.userData.index],a=((s.angle%360)+360)%360,t=(p.reverse?360-a:a)/360*Math.max(.001,s.v.duration-.001);s.want=t;if(Math.abs(s.v.currentTime-t)<.02)return;s.seeking=true;s.v.currentTime=t}
function grid(){
  const n=P.length,aspect=innerWidth/innerHeight,cols=n===1?1:aspect<.8?2:n<=4?2:3,rows=Math.ceil(n/cols);
  const width=Math.min(1.86,aspect*1.88),height=1.56,cellW=width/cols,cellH=height/rows,gap=Math.min(cellW,cellH)*.018;
  const bias=(c,r)=>{const p=P[Math.min(n-1,Math.max(0,r-1)*cols+Math.max(0,c-1))];const shape=p.shape;return typeof shape==='string'?shape.includes('left')?-.35:shape.includes('right')?.35:shape==='rectangle'?0:.15:0};
  const vertices=Array.from({length:rows+1},(_,r)=>Array.from({length:cols+1},(_,c)=>{
    const seed=(c*73+r*131+n*41)%17-8,jitter=seed/8;
    return{x:-width/2+c*cellW+(c===0||c===cols?0:(jitter*.045+bias(c,r)*.09)*cellW),y:height/2-r*cellH+(r===0||r===rows?0:((c*11+r*7)%9-4)*.008*cellH)};
  }));
  return P.map((_,i)=>{
    const c=i%cols,r=Math.floor(i/cols),v=[vertices[r][c],vertices[r][c+1],vertices[r+1][c+1],vertices[r+1][c]];
    const x0=Math.min(...v.map(p=>p.x)),x1=Math.max(...v.map(p=>p.x)),y0=Math.min(...v.map(p=>p.y)),y1=Math.max(...v.map(p=>p.y));
    const points=v.map(p=>[(p.x-x0)/(x1-x0),(y1-p.y)/(y1-y0)]);
    const centerX=(x0+x1)/2,centerY=(y0+y1)/2;
    return{x:centerX,y:centerY,w:x1-x0,h:y1-y0,points,gap};
  });
}
let boxes=[];
function layout(){renderer.setSize(innerWidth,innerHeight);const aspect=innerWidth/innerHeight;camera.left=-aspect;camera.right=aspect;camera.top=1;camera.bottom=-1;camera.updateProjectionMatrix();boxes=grid();const focused=focus>=0;states.forEach((s,i)=>{const b=boxes[i],ratio=P[i].width/P[i].height;setPolygon(s,b.points,b.w/b.h,ratio);s.mesh.position.set(b.x,b.y,focused&&i!==focus?-2:0);s.mesh.scale.set(b.w-b.gap,b.h-b.gap,1);s.mesh.visible=!focused||i===focus;s.mat.uniforms.resolution.value.set(innerWidth,innerHeight);s.cap.style.display=!focused||i===focus?'block':'none'});if(focused){const s=states[focus],ratio=P[focus].width/P[focus].height,w=Math.min(aspect*1.72,1.72*ratio),h=w/ratio;setPolygon(s,shapePoints(P[focus].shape),w/h,ratio);s.mesh.position.set(0,0,0);s.mesh.scale.set(w,h,1)}projectCaptions()}
function projectCaptions(){scene.updateMatrixWorld();camera.updateMatrixWorld();states.forEach((s,i)=>{if(!s.mesh.visible)return;const box=s.mesh.localToWorld(new THREE.Vector3(0,0,.02)).project(camera),cx=(box.x+1)*innerWidth/2,cy=(1-box.y)*innerHeight/2,sw=s.mesh.scale.x*innerHeight/2,sh=s.mesh.scale.y*innerHeight/2,pos=P[i].captionPosition||{x:.5,y:.12};const cap=s.cap;const edge=pos.y<=.3?'top':pos.y>=.7?'bottom':pos.x<.5?'left':'right',maxWidth=Math.max(70,sw*(edge==='top'||edge==='bottom'?.66:.42));cap.style.maxWidth=`${maxWidth}px`;cap.style.width='max-content';const width=Math.min(cap.offsetWidth,maxWidth),height=cap.offsetHeight;let x=cx+(pos.x-.5)*sw,y=cy+(pos.y-.5)*sh;if(edge==='top')y=cy-sh/2+height/2+7;else if(edge==='bottom')y=cy+sh/2-height/2-7;else if(edge==='left')x=cx-sw/2+width/2+7;else x=cx+sw/2-width/2-7;const minX=cx-sw/2+width/2+7,maxX=cx+sw/2-width/2-7,minY=cy-sh/2+height/2+7,maxY=cy+sh/2-height/2-7;cap.style.left=`${Math.min(Math.max(x,minX),Math.max(minX,maxX))}px`;cap.style.top=`${Math.min(Math.max(y,minY),Math.max(minY,maxY))}px`})}
function hit(e){pointer.set(e.clientX/innerWidth*2-1,1-e.clientY/innerHeight*2);ray.setFromCamera(pointer,camera);return ray.intersectObjects(states.filter(s=>s.mesh.visible).map(s=>s.mesh),false)[0]?.object.userData.index??-1}
function down(e){const i=hit(e);if(i<0)return;renderer.domElement.setPointerCapture(e.pointerId);drag={i,x:e.clientX,t:performance.now(),moved:0};states[i].spin=false;renderer.domElement.classList.add('dragging')}
function move(e){if(!drag){hover=hit(e);renderer.domElement.style.cursor=hover>=0?'grab':'default';return}const dx=e.clientX-drag.x;drag.x=e.clientX;drag.moved+=Math.abs(dx);states[drag.i].angle+=dx*(P[drag.i].reverse?-1:1)*.42;seek(states[drag.i]);sync()}
function up(e){if(!drag)return;const d=drag;drag=null;renderer.domElement.classList.remove('dragging');if(d.moved<8)setFocus(focus===d.i?-1:d.i)}
renderer.domElement.addEventListener('pointerdown',down);renderer.domElement.addEventListener('pointermove',move);renderer.domElement.addEventListener('pointerup',up);renderer.domElement.addEventListener('pointercancel',up);
function setFocus(i){focus=i;document.body.classList.toggle('focus',i>=0);layout();sync();flashHelp(i>=0?'拖动旋转 · 使用按钮切换漫画格':'横向拖动漫画格旋转视角 · 点击进入单格')}
function sync(){$('spin').textContent=focus>=0?'自动旋转':'全部转动';$('spin').setAttribute('aria-pressed',String((focus>=0?[states[focus]]:states).every(s=>s.spin)));$('status').textContent=focus>=0?`${focus+1} / ${P.length}`:`${P.length} 格`}
function targets(){return focus>=0?[states[focus]]:states}
$('spin').onclick=()=>{const t=targets(),on=!t.every(s=>s.spin);t.forEach(s=>s.spin=on);sync()};$('reset').onclick=()=>{targets().forEach(s=>{s.spin=false;s.angle=s.start;seek(s)});sync()};$('ink').onclick=()=>{ink=!ink;states.forEach(s=>s.mat.uniforms.ink.value=ink?1:0);$('ink').setAttribute('aria-pressed',String(ink))};
$('back').onclick=()=>setFocus(-1);$('prev').onclick=()=>setFocus((focus-1+P.length)%P.length);$('next').onclick=()=>setFocus((focus+1)%P.length);
addEventListener('keydown',e=>{if(e.key==='Escape')setFocus(-1);else if(e.key==='ArrowLeft'&&focus>=0)$('prev').click();else if(e.key==='ArrowRight'&&focus>=0)$('next').click();else if(e.key===' '){{$('spin').click();e.preventDefault()}}else if(e.key.toLowerCase()==='r')$('reset').click();else if(e.key.toLowerCase()==='h')$('ink').click()});
let helpTimer;function flashHelp(text){$('help').textContent=text;$('help').style.opacity=1;clearTimeout(helpTimer);helpTimer=setTimeout(()=>$('help').style.opacity=.15,5000)}
let last=performance.now();function tick(now){const dt=Math.min(.05,(now-last)/1000);last=now;states.forEach(s=>{if(s.spin){s.angle+=28*dt;seek(s)}});renderer.render(scene,camera);requestAnimationFrame(tick)}
addEventListener('resize',layout);layout();sync();flashHelp($('help').textContent);requestAnimationFrame(tick);
</script>
</body>
</html>
